name: ZMK Firmware Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ninja-build gperf ccache dfu-util device-tree-compiler wget xz-utils file make gcc g++ unzip
          pip install west

      - name: Install Zephyr SDK
        run: |
          wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.4/zephyr-sdk-0.16.4_linux-x86_64.tar.xz
          tar xf zephyr-sdk-0.16.4_linux-x86_64.tar.xz
          cd zephyr-sdk-0.16.4
          ./setup.sh -t all -h -c
        working-directory: ${{ runner.temp }}

      - name: Set up environment
        run: |
          echo "ZEPHYR_SDK_INSTALL_DIR=${{ runner.temp }}/zephyr-sdk-0.16.4" >> $GITHUB_ENV

      - name: Init and update west
        run: |
          west init -l config
          west update
          west zephyr-export

      - name: Build firmware
        run: |
          west build -s zmk/app -d build/left -b nice_nano_v2 -- -DSHIELD="corne_left nice_view_adapter nice_view_gem"
